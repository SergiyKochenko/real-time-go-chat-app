# CI/CD workflow for real-time-go-chat-app
# Builds and tests both frontend and backend, deploys using Docker Compose

name: CI + CD Pipeline

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Backend build & test
      - name: Set up Node.js (backend)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: ./backend
      - name: Run backend tests with coverage threshold
        run: npm run test:coverage
        working-directory: ./backend

      - name: Upload backend coverage
        if: ${{ always() && hashFiles('backend/coverage/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.run_id }}
          path: backend/coverage
          retention-days: 14

      # Frontend build & test
      - name: Set up Node.js (frontend)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: ./frontend
      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

      - name: Upload frontend coverage
        if: ${{ always() && hashFiles('frontend/coverage/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: frontend/coverage
          retention-days: 14

      - name: Upload frontend build artifact
        if: ${{ always() && hashFiles('frontend/dist/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend/dist
          retention-days: 7

      - name: Checks complete
        run: echo "Build and tests completed successfully."

  DeployDev:
    name: Deploy to Development
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ Build ]
    runs-on: ubuntu-latest
    environment: development
    env:
      NODE_ENV: development
      FRONTEND_URL: ${{ vars.DEV_FRONTEND_URL }}
      BACKEND_URL: ${{ vars.DEV_BACKEND_URL }}
      PORT: 5001
      MONGODB_URI: ${{ secrets.DEV_MONGODB_URI }}
      JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.DEV_CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.DEV_CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.DEV_CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - name: Create backend .env (Dev)
        run: |
          cat <<EOF > backend/.env
          MONGODB_URI=${MONGODB_URI}
          PORT=${PORT}
          JWT_SECRET=${JWT_SECRET}
          CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
          CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
          CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
          NODE_ENV=${NODE_ENV}
          EOF
      - name: Deploy with Docker Compose (Dev)
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build
          echo "Deployed to Development (${{ vars.DEV_FRONTEND_URL }})"
        working-directory: ${{ github.workspace }}

  DeployStaging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ Build ]
    runs-on: ubuntu-latest
    environment: staging
    env:
      NODE_ENV: staging
      FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
      BACKEND_URL: ${{ vars.STAGING_BACKEND_URL }}
      PORT: 5001
      MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
      JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.STAGING_CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.STAGING_CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.STAGING_CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - name: Create backend .env (Staging)
        run: |
          cat <<EOF > backend/.env
          MONGODB_URI=${MONGODB_URI}
          PORT=${PORT}
          JWT_SECRET=${JWT_SECRET}
          CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
          CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
          CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
          NODE_ENV=${NODE_ENV}
          EOF
      - name: Deploy with Docker Compose (Staging)
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build
          echo "Deployed to Staging (${{ vars.STAGING_FRONTEND_URL }})"
        working-directory: ${{ github.workspace }}

  DeployProduction:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [DeployStaging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://real-time-go-chat-app.onrender.com
    env:
      NODE_ENV: production
      FRONTEND_URL: ${{ vars.PROD_FRONTEND_URL }}
      BACKEND_URL: ${{ vars.PROD_BACKEND_URL }}
      PORT: 5001
      MONGODB_URI: ${{ secrets.PROD_MONGODB_URI }}
      JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.PROD_CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.PROD_CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.PROD_CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - name: Create backend .env (Production)
        run: |
          cat <<EOF > backend/.env
          MONGODB_URI=${MONGODB_URI}
          PORT=${PORT}
          JWT_SECRET=${JWT_SECRET}
          CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
          CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
          CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
          NODE_ENV=${NODE_ENV}
          EOF
      - name: Deploy with Docker Compose (Production)
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build
          echo "Deployed to Production (https://real-time-go-chat-app.onrender.com/)"
        working-directory: ${{ github.workspace }}

  SmokeTest:
    name: Smoke Test (Main)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [DeployProduction]
    runs-on: ubuntu-latest
    env:
      SMOKE_TEST_URL: ${{ vars.PROD_HEALTHCHECK_URL }}
    steps:
      - name: Smoke test production endpoint
        if: env.SMOKE_TEST_URL != ''
        run: |
          curl -fsSL "$SMOKE_TEST_URL" > /dev/null

  NotifyFeatureFailure:
    name: Notify Feature Branch Failure
    if: ${{ always() && github.event_name == 'push' && github.ref != 'refs/heads/main' && needs.Build.result == 'failure' }}
    needs: [Build]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare failure report
        run: |
          cat <<'EOF' > failure.md
          # CI failed on feature branch

          The build failed for `${{ github.ref_name }}`.

          - Workflow: `${{ github.workflow }}`
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Commit: `${{ github.sha }}`
          - Actor: `${{ github.actor }}`
          EOF
      - name: Create issue and assign to pusher
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "CI failure on ${{ github.ref_name }}"
          content-filepath: failure.md
          assignees: ${{ github.event.sender.login }}

  NotifyMainFailure:
    name: Notify Main Smoke Test Failure
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.SmokeTest.result == 'failure' }}
    needs: [SmokeTest]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare incident report
        run: |
          cat <<'EOF' > incident.md
          # Smoke test failed on main

          The production smoke test failed after a push to `main`.

          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Commit: `${{ github.sha }}`
          - Actor: `${{ github.actor }}`
          EOF
      - name: Create incident issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "[Incident] Smoke test failed on main"
          content-filepath: incident.md
