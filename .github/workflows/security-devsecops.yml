name: DevSecOps Security Scans

on:
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-audit:
    name: Dependency Audit Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend

      - name: Run npm audit for frontend
        shell: bash
        run: npm --prefix frontend audit --omit=dev --json > frontend-audit.json || true

      - name: Run npm audit for backend
        shell: bash
        run: npm --prefix backend audit --omit=dev --json > backend-audit.json || true

      - name: Summarize vulnerabilities in job report
        shell: bash
        run: |
          echo "## Dependency Audit Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Frontend" >> "$GITHUB_STEP_SUMMARY"
          jq '.metadata.vulnerabilities' frontend-audit.json >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Backend" >> "$GITHUB_STEP_SUMMARY"
          jq '.metadata.vulnerabilities' backend-audit.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dependency audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            frontend-audit.json
            backend-audit.json
          retention-days: 14
