name: Feature request
description: Propose an enhancement to product or delivery workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user or team problem are we solving?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the implementation idea and expected value.
    validations:
      required: true

  - type: textarea
    id: nonfunctional
    attributes:
      label: Non-functional impact
      description: Any impact on reliability, security, performance, or deployment?

  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: Define measurable acceptance criteria.
      placeholder: e.g. Lead time reduction, build duration, defect escape rate
