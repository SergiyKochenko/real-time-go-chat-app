<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .frame { fill: #ffffff; stroke: #374151; stroke-width: 2; }
    .muted { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .line { stroke: #9ca3af; stroke-width: 2; }
    .title { font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #111827; }
    .label { font-family: Arial, sans-serif; font-size: 14px; fill: #6b7280; }
    .text { font-family: Arial, sans-serif; font-size: 16px; fill: #374151; }
  </style>

  <rect x="20" y="20" width="1160" height="760" rx="20" class="frame" />

  <text x="60" y="80" class="title">Signup Page Wireframe</text>

  <rect x="60" y="120" width="480" height="600" rx="16" class="muted" />
  <text x="90" y="160" class="label">Illustration / Pattern</text>
  <line x1="90" y1="190" x2="510" y2="190" class="line" />
  <line x1="90" y1="220" x2="470" y2="220" class="line" />
  <line x1="90" y1="250" x2="490" y2="250" class="line" />

  <rect x="600" y="140" width="520" height="540" rx="16" class="muted" />
  <text x="630" y="190" class="title">Create Account</text>
  <text x="630" y="220" class="label">Subtitle text</text>

  <text x="630" y="270" class="label">Full Name</text>
  <rect x="630" y="285" width="460" height="44" rx="8" class="frame" />

  <text x="630" y="350" class="label">Email</text>
  <rect x="630" y="365" width="460" height="44" rx="8" class="frame" />

  <text x="630" y="430" class="label">Password</text>
  <rect x="630" y="445" width="460" height="44" rx="8" class="frame" />

  <rect x="630" y="510" width="460" height="48" rx="10" class="frame" />
  <text x="815" y="542" class="text">Create Account</text>

  <text x="630" y="600" class="label">Already have an account? Sign in</text>
</svg>
