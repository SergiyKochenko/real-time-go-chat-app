<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .frame { fill: #ffffff; stroke: #374151; stroke-width: 2; }
    .muted { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .panel { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; }
    .line { stroke: #9ca3af; stroke-width: 2; }
    .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
    .label { font-family: Arial, sans-serif; font-size: 14px; fill: #6b7280; }
    .text { font-family: Arial, sans-serif; font-size: 16px; fill: #374151; }
  </style>

  <rect x="20" y="20" width="1160" height="760" rx="20" class="frame" />
  <text x="60" y="80" class="title">Profile Page Wireframe</text>

  <rect x="80" y="130" width="1040" height="600" rx="16" class="panel" />

  <circle cx="180" cy="230" r="60" class="muted" />
  <text x="120" y="320" class="label">Avatar</text>

  <text x="300" y="210" class="label">Full Name</text>
  <rect x="300" y="225" width="780" height="44" rx="8" class="muted" />

  <text x="300" y="290" class="label">Email</text>
  <rect x="300" y="305" width="780" height="44" rx="8" class="muted" />

  <text x="300" y="370" class="label">Bio / About</text>
  <rect x="300" y="385" width="780" height="100" rx="10" class="muted" />

  <rect x="300" y="520" width="200" height="44" rx="10" class="frame" />
  <text x="350" y="548" class="text">Save</text>

  <rect x="520" y="520" width="200" height="44" rx="10" class="frame" />
  <text x="555" y="548" class="text">Change Photo</text>

  <line x1="120" y1="610" x2="1080" y2="610" class="line" />
  <text x="120" y="650" class="label">Account details and status</text>
</svg>
