<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .frame { fill: #ffffff; stroke: #374151; stroke-width: 2; }
    .muted { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .panel { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; }
    .line { stroke: #9ca3af; stroke-width: 2; }
    .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
    .label { font-family: Arial, sans-serif; font-size: 14px; fill: #6b7280; }
    .text { font-family: Arial, sans-serif; font-size: 16px; fill: #374151; }
  </style>

  <rect x="20" y="20" width="1160" height="760" rx="20" class="frame" />
  <text x="60" y="80" class="title">Settings Page Wireframe</text>

  <rect x="80" y="130" width="520" height="600" rx="16" class="panel" />
  <text x="110" y="170" class="label">Theme Grid</text>

  <rect x="110" y="200" width="140" height="90" rx="10" class="muted" />
  <rect x="270" y="200" width="140" height="90" rx="10" class="muted" />
  <rect x="430" y="200" width="140" height="90" rx="10" class="muted" />

  <rect x="110" y="310" width="140" height="90" rx="10" class="muted" />
  <rect x="270" y="310" width="140" height="90" rx="10" class="muted" />
  <rect x="430" y="310" width="140" height="90" rx="10" class="muted" />

  <rect x="110" y="420" width="140" height="90" rx="10" class="muted" />
  <rect x="270" y="420" width="140" height="90" rx="10" class="muted" />
  <rect x="430" y="420" width="140" height="90" rx="10" class="muted" />

  <rect x="640" y="130" width="480" height="600" rx="16" class="panel" />
  <text x="670" y="170" class="label">Live Preview</text>
  <rect x="670" y="200" width="420" height="120" rx="12" class="muted" />
  <rect x="700" y="340" width="360" height="44" rx="12" class="muted" />
  <rect x="760" y="400" width="300" height="44" rx="12" class="muted" />
  <rect x="700" y="470" width="360" height="44" rx="12" class="muted" />

  <line x1="670" y1="560" x2="1090" y2="560" class="line" />
  <text x="670" y="595" class="label">Theme applies instantly</text>
</svg>
