<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .frame { fill: #ffffff; stroke: #374151; stroke-width: 2; }
    .muted { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .line { stroke: #9ca3af; stroke-width: 2; }
    .title { font-family: Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #111827; }
    .label { font-family: Arial, sans-serif; font-size: 14px; fill: #6b7280; }
    .text { font-family: Arial, sans-serif; font-size: 16px; fill: #374151; }
  </style>

  <rect x="20" y="20" width="1160" height="760" rx="20" class="frame" />

  <text x="60" y="80" class="title">Login Page Wireframe</text>

  <rect x="60" y="120" width="480" height="600" rx="16" class="muted" />
  <text x="90" y="160" class="label">Illustration / Pattern</text>
  <line x1="90" y1="190" x2="510" y2="190" class="line" />
  <line x1="90" y1="220" x2="470" y2="220" class="line" />
  <line x1="90" y1="250" x2="490" y2="250" class="line" />

  <rect x="600" y="150" width="520" height="520" rx="16" class="muted" />
  <text x="630" y="200" class="title">Welcome Back</text>
  <text x="630" y="230" class="label">Subtitle text</text>

  <text x="630" y="280" class="label">Email</text>
  <rect x="630" y="295" width="460" height="44" rx="8" class="frame" />

  <text x="630" y="360" class="label">Password</text>
  <rect x="630" y="375" width="460" height="44" rx="8" class="frame" />

  <rect x="630" y="440" width="460" height="48" rx="10" class="frame" />
  <text x="820" y="472" class="text">Sign In</text>

  <text x="630" y="520" class="label">Forgot password</text>
  <text x="630" y="560" class="label">New here? Create account</text>
</svg>
