<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .frame { fill: #ffffff; stroke: #374151; stroke-width: 2; }
    .muted { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .panel { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; }
    .line { stroke: #9ca3af; stroke-width: 2; }
    .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
    .label { font-family: Arial, sans-serif; font-size: 14px; fill: #6b7280; }
    .text { font-family: Arial, sans-serif; font-size: 16px; fill: #374151; }
  </style>

  <rect x="20" y="20" width="1160" height="760" rx="20" class="frame" />
  <text x="60" y="80" class="title">Chat Interface Wireframe</text>

  <rect x="60" y="120" width="280" height="620" rx="16" class="panel" />
  <text x="90" y="160" class="label">Sidebar</text>
  <rect x="90" y="190" width="220" height="40" rx="8" class="muted" />
  <rect x="90" y="240" width="220" height="40" rx="8" class="muted" />
  <rect x="90" y="290" width="220" height="40" rx="8" class="muted" />
  <rect x="90" y="340" width="220" height="40" rx="8" class="muted" />
  <rect x="90" y="390" width="220" height="40" rx="8" class="muted" />

  <rect x="360" y="120" width="780" height="70" rx="12" class="panel" />
  <text x="390" y="165" class="label">Chat Header</text>

  <rect x="360" y="210" width="780" height="450" rx="12" class="panel" />
  <text x="390" y="250" class="label">Message List</text>
  <rect x="420" y="290" width="420" height="44" rx="12" class="muted" />
  <rect x="560" y="350" width="420" height="44" rx="12" class="muted" />
  <rect x="420" y="410" width="360" height="44" rx="12" class="muted" />

  <rect x="360" y="680" width="780" height="60" rx="12" class="panel" />
  <text x="390" y="718" class="label">Message input</text>
  <rect x="900" y="690" width="210" height="40" rx="10" class="muted" />
  <text x="970" y="718" class="text">Send</text>
</svg>
