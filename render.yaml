services:
  - type: web
    name: chat-app-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001

  - type: static
    name: chat-app-frontend
    rootDir: frontend/dist
    buildCommand: npm install --prefix ../backend && npm install --prefix . && npm run build
    publicPath: /
